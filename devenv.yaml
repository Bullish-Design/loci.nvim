# yaml-language-server: $schema=https://devenv.sh/devenv.schema.json
#
# loci.nvim — a repoman-managed devenv repo.
inputs:
  nixpkgs:
    url: github:cachix/devenv-nixpkgs/rolling

  # vendomat supplies prebuilt wheels for native libs (pyjutsu) from the Nix store.
  # The `git` manager (gitman) depends on pyjutsu, whose maturin/Rust extension we
  # DON'T compile here — vendomat's module exports UV_FIND_LINKS so repoman-sync
  # installs the `wheel:pyjutsu` entry from repoman.lock as a prebuilt wheel instead
  # of building it. Project 039: that module now reaches this repository from the
  # system profile through the central devenv.local.nix, so no input is declared.

